<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Katzrin Guide · מדריך קצרין</title>
  <meta name="description" content="Bilingual chatbot to help families and businesses move to Katzrin, Golan Heights." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app state-empty" id="app">
    <header class="topbar">
      <span class="logo">🏔️</span>
      <span class="brand">Katzrin&nbsp;Guide <span class="he">· מדריך קצרין</span></span>
    </header>

    <!-- EMPTY STATE: centered, ChatGPT/Gemini-style -->
    <section class="hero" id="hero">
      <div class="hero-logo">🏔️</div>
      <h1 class="hero-title">Katzrin Guide <span class="he">· מדריך קצרין</span></h1>
      <p class="hero-sub">Your bilingual guide to moving to Katzrin.</p>

      <form class="composer hero-composer" id="heroForm" autocomplete="off">
        <div class="input-wrap">
          <span class="ph" id="ph" aria-hidden="true"></span>
          <input id="heroInput" class="input" type="text" maxlength="1200" aria-label="Your message" />
        </div>
        <button class="send" type="submit" aria-label="Send">➤</button>
      </form>

      <div class="chips" id="chips">
        <button class="chip">What are the schools like?</button>
        <button class="chip">כמה עולה דירה בקצרין?</button>
        <button class="chip">Is Katzrin safe?</button>
        <button class="chip">איך פותחים עסק בקצרין?</button>
      </div>
    </section>

    <!-- CHAT STATE: messages + bottom bar -->
    <section class="chat" id="chat" aria-live="polite"></section>

    <div class="bottombar" id="bottombar">
      <form class="composer" id="bottomForm" autocomplete="off">
        <input id="bottomInput" class="input" type="text" maxlength="1200"
               placeholder="Ask about Katzrin…  ·  שאלו על קצרין…" aria-label="Your message" />
        <button class="send" type="submit" aria-label="Send">➤</button>
      </form>
      <p class="disclaimer">Guidance from a knowledge base — confirm prices, forms &amp; eligibility with official sources.</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
