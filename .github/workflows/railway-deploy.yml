name: Railway deploy

# Manually-triggered deploy helper. The Railway token is provided at dispatch
# time and is never stored in the repository. It is passed via job-level env
# (step-level env values get echoed into public logs; job-level ones do not).
on:
  workflow_dispatch:
    inputs:
      railway_token:
        description: "Railway API token (used for this run only, not stored)"
        required: true
        type: string
      google_maps_api_key:
        description: "Optional: set GOOGLE_MAPS_API_KEY on the Railway service before deploying"
        required: false
        type: string
        default: ""

permissions: {}

concurrency: railway-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ inputs.railway_token }}
      SET_GOOGLE_MAPS_API_KEY: ${{ inputs.google_maps_api_key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Connect repo + deploy on Railway
        run: |
          echo "::add-mask::$RAILWAY_TOKEN"
          if [ -n "$SET_GOOGLE_MAPS_API_KEY" ]; then echo "::add-mask::$SET_GOOGLE_MAPS_API_KEY"; fi
          node scripts/railway-deploy.mjs
